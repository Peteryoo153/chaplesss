<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIS Chapel Seating — 2026 Fall</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f6f6f6;color:#222;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  header{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 22px}
  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
  header .sub{color:#666;font-size:12.5px;margin-top:4px}
  .app{display:flex;min-height:calc(100vh - 68px)}
  .sidebar{width:290px;background:#fff;border-right:1px solid #e5e5e5;padding:14px;overflow-y:auto;flex-shrink:0}
  .sidebar h3{font-size:11px;text-transform:uppercase;color:#888;margin:14px 0 6px;font-weight:700;letter-spacing:.5px}
  .sidebar h3:first-child{margin-top:0}
  .classes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cbtn{padding:12px 4px;border:2px solid transparent;border-radius:6px;cursor:pointer;color:#fff;
    text-align:center;font-size:13px;font-weight:700;transition:transform .08s;position:relative}
  .cbtn:hover{transform:scale(1.06)}
  .cbtn.active{outline:2px solid #000;outline-offset:2px}
  .cbtn .tg{display:block;font-size:9.5px;font-weight:600;opacity:.85;margin-top:2px}
  .actions button{display:block;width:100%;padding:8px;margin-bottom:5px;border:1px solid #ddd;background:#fff;
    border-radius:5px;cursor:pointer;font-size:13px}
  .actions button:hover{background:#f2f2f2}
  .counts{font-size:12px;color:#333;line-height:1.6}
  .dept{margin-bottom:10px}
  .dept .dh{font-weight:700;font-size:12px;margin:2px 0 4px;display:flex;justify-content:space-between}
  .dept .dh .n{color:#666;font-weight:600}
  .row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11.5px}
  .row .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
  .row .k{width:32px;font-weight:700}
  .row .b{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:0 4px}
  .row .b span{display:block;height:100%;background:#4a90e2;transition:width .2s}
  .row .b.over span{background:#e74c3c}
  .row .b.done span{background:#27ae60}
  .row .v{font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-size:11px;color:#555}
  .totals{font-weight:700;font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px solid #eee}
  .board{flex:1;padding:22px;overflow:auto}
  .stage{text-align:center;letter-spacing:10px;font-weight:700;font-size:13px;color:#555;
    padding:10px;background:#eee;border-radius:4px;max-width:900px;margin:0 auto 18px}
  .groups{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:1240px;margin:0 auto}
  .glabel{text-align:center;font-weight:700;color:#666;font-size:12px;margin-bottom:8px;letter-spacing:1px}
  .grid{display:grid;gap:5px}
  .seat{aspect-ratio:1.35/1;border-radius:4px;border:2px solid transparent;display:flex;align-items:center;
    justify-content:center;font-size:10.5px;color:#fff;font-weight:700;cursor:pointer;user-select:none;
    background:#d5d5d5;transition:transform .08s;line-height:1;position:relative}
  .seat:hover{transform:scale(1.08);z-index:2}
  .seat.hidden{visibility:hidden;pointer-events:none}
  /* 빈 좌석: 슬롯 타입별 스타일 */
  .seat.empty.fixed{background:#eeeeee;border:1.5px solid #d0d0d0;color:#aaa}
  .seat.empty.tr{background:#fafafa;border:1.5px dashed #b0b0b0;color:#aaa;
    background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.03) 0 4px,transparent 4px 8px)}
  .seat.empty.extra{background:transparent;border:1.5px dashed #c8c8c8;color:transparent;
    border-top-width:4px;border-top-style:solid;border-top-color:#c8c8c8}
  .seat.empty:hover{border-color:#666;color:#666}
  .seat.empty.tr::after,.seat.empty.extra::after{content:attr(data-slot);
    position:absolute;font-size:8.5px;color:#999;font-weight:600;letter-spacing:.5px}
  /* 배정된 좌석 */
  .seat.tr{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px);
    border-style:dashed;border-color:#fff}
  .seat.extra{border-top-width:5px;border-top-style:solid;border-top-color:#fff}
  .media{margin:28px auto 0;max-width:440px;text-align:center}
  .mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .hint{color:#888;font-size:11.5px;margin-top:10px;line-height:1.6}
  .hint b{color:#555}
  @media print{
    .sidebar,header{display:none}
    .board{padding:12px}
  }
</style>
</head>
<body>
<header>
  <h1>LIS Chapel Seating Arrangements</h1>
  <div class="sub">2026 Fall Semester · 초등부 48 · 중등부 38 · 고등부 62 · 전체 148명</div>
</header>
<div class="app">
  <aside class="sidebar">
    <h3>클래스 선택</h3>
    <div class="classes" id="classes"></div>

    <h3>동작</h3>
    <div class="actions">
      <button id="clearAll">전체 배정 초기화</button>
      <button id="exportJson">JSON 내보내기</button>
      <button id="importJson">JSON 불러오기</button>
      <button id="print">인쇄 / PDF 저장</button>
    </div>

    <h3>부서별 현황</h3>
    <div class="counts" id="counts"></div>

    <div class="hint">
      • <b>좌클릭</b> = 선택한 반 배정<br>
      • <b>우클릭</b> = 좌석 비우기<br>
      • 자동 저장(브라우저)<br>
      • 좌석 종류: 일반 · <b>Tr</b>(빗금·인솔석) · <b>엑스트라</b>(윗선 굵음)
    </div>
  </aside>
  <main class="board">
    <div class="stage">S T A G E</div>
    <div class="groups">
      <div>
        <div class="glabel">GROUP A · 4×12 + EXTRA</div>
        <div class="grid" id="grid-a" style="grid-template-columns:repeat(6,1fr)"></div>
      </div>
      <div>
        <div class="glabel">GROUP B · 4×12 + EXTRA</div>
        <div class="grid" id="grid-b" style="grid-template-columns:repeat(6,1fr)"></div>
      </div>
      <div>
        <div class="glabel">GROUP C · 4×10 + EXTRA</div>
        <div class="grid" id="grid-c" style="grid-template-columns:repeat(6,1fr)"></div>
      </div>
    </div>
    <div class="media">
      <div class="glabel">MEDIA DESK · 방송실 6석</div>
      <div class="mgrid" id="grid-m"></div>
    </div>
  </main>
</div>
<script>
// ── 클래스 정의 (색상 + 목표 인원)
const CLASSES = {
  'E1':{color:'#b8b8b8',target:8},
  'E2':{color:'#ee8524',target:9},
  'E3':{color:'#b18a12',target:11},
  'E4':{color:'#2f7d3a',target:11},
  'E5':{color:'#256238',target:9},
  'M6':{color:'#e57e75',target:11},
  'M7':{color:'#d3453a',target:14},
  'M8':{color:'#7b1f1f',target:13},
  'H9':{color:'#8b2fa6',target:16},
  'H10':{color:'#e6248a',target:20},
  'H11':{color:'#8b5535',target:9},
  'H12':{color:'#1a1a1a',target:17}
};
const DEPTS = [
  {name:'초등부', classes:['E1','E2','E3','E4','E5']},
  {name:'중등부', classes:['M6','M7','M8']},
  {name:'고등부', classes:['H9','H10','H11','H12']}
];

// ── 좌석 슬롯 지도 (물리적 위치, 불변) : null | {s:'fixed'|'tr'|'extra'}
// 각 셀은 배정된 반 c 를 갖는다: {s, c:null|'E1'}
const F = {s:'fixed'}, T = {s:'tr'}, X = {s:'extra'};
const SLOTS = {
  a: [
    [null, X,  X,  X,  X,  null],
    [X,    F,  F,  F,  F,  X   ],
    [T,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [T,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [T,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [T,    F,  F,  F,  F,  X   ],
    [T,    F,  F,  F,  F,  X   ],
    [null, X,  X,  X,  X,  null]
  ],
  b: [
    [null, X,  X,  X,  X,  null],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [null, X,  X,  X,  T,  null]
  ],
  c: [
    [null, X,  X,  X,  X,  null],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  T   ],
    [X,    F,  F,  F,  F,  X   ],
    [T,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  T   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [X,    F,  F,  F,  F,  X   ],
    [T,    F,  F,  F,  F,  X   ],
    [null, X,  X,  X,  T,  null]
  ],
  m: [F,F,F,T,F,F]
};

function makeEmptyState(){
  const clone = o => Array.isArray(o) ? o.map(clone) : (o && typeof o==='object') ? {...o, c:null} : o;
  return {a:clone(SLOTS.a), b:clone(SLOTS.b), c:clone(SLOTS.c), m:clone(SLOTS.m)};
}

const STORAGE_KEY = 'lis-chapel-seating-2026-fall-v2';
let state = null;
let activeClass = 'E1';

function loadState(){
  const fresh = makeEmptyState();
  const s = localStorage.getItem(STORAGE_KEY);
  if(!s) return fresh;
  try{
    const p = JSON.parse(s);
    if(!p) return fresh;
    // 새 레이아웃 위에 이전 배정(c값)만 병합 — 좌석 구조가 바뀌어도 배정은 유지
    ['a','b','c'].forEach(g => {
      if(!Array.isArray(p[g])) return;
      fresh[g].forEach((row, r) => row.forEach((cell, ci) => {
        const old = p[g]?.[r]?.[ci];
        if(cell && old && old.c) cell.c = old.c;
      }));
    });
    if(Array.isArray(p.m)){
      fresh.m.forEach((cell, i) => {
        const old = p.m[i];
        if(cell && old && old.c) cell.c = old.c;
      });
    }
    return fresh;
  }catch(e){ return fresh; }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function renderClasses(){
  const c = document.getElementById('classes');
  c.innerHTML = '';
  Object.entries(CLASSES).forEach(([cls,meta])=>{
    const b = document.createElement('div');
    b.className = 'cbtn' + (cls===activeClass?' active':'');
    b.style.background = meta.color;
    b.innerHTML = `${cls}<span class="tg">${meta.target}명</span>`;
    b.onclick = ()=>{ activeClass = cls; renderClasses(); };
    c.appendChild(b);
  });
}

function makeSeat(seat, group, r, ci){
  const el = document.createElement('div');
  el.className = 'seat';
  if(!seat){ el.classList.add('hidden'); return el; }
  const slot = seat.s;
  if(!seat.c){
    el.classList.add('empty', slot);
    if(slot==='tr'){ el.setAttribute('data-slot','Tr'); }
    if(slot==='extra'){ el.setAttribute('data-slot','Ex'); }
  } else {
    const col = CLASSES[seat.c]?.color || '#888';
    el.style.background = col;
    el.textContent = seat.c + (slot==='tr'?' Tr':'');
    if(slot==='tr') el.classList.add('tr');
    if(slot==='extra') el.classList.add('extra');
  }
  el.oncontextmenu = e => { e.preventDefault(); clearSeat(group,r,ci); };
  el.onclick = ()=> assignSeat(group,r,ci);
  el.title = slot==='tr'?'Tr (인솔석)': slot==='extra'?'엑스트라':'일반';
  return el;
}

function getSeat(group, r, ci){
  return group==='m' ? state.m[ci] : state[group][r][ci];
}
function setSeat(group, r, ci, next){
  if(group==='m') state.m[ci] = next;
  else state[group][r][ci] = next;
}

function assignSeat(group, r, ci){
  const s = getSeat(group,r,ci);
  if(!s) return;
  setSeat(group, r, ci, {s:s.s, c:activeClass});
  saveState(); renderAll();
}
function clearSeat(group, r, ci){
  const s = getSeat(group,r,ci);
  if(!s) return;
  setSeat(group, r, ci, {s:s.s, c:null});
  saveState(); renderAll();
}

function renderGrid(g){
  const el = document.getElementById('grid-'+g);
  el.innerHTML = '';
  if(g==='m'){
    state.m.forEach((s,i)=>el.appendChild(makeSeat(s,'m',0,i)));
    return;
  }
  state[g].forEach((row,r)=>row.forEach((s,c)=>{
    el.appendChild(makeSeat(s,g,r,c));
  }));
}

function renderAll(){
  renderGrid('a'); renderGrid('b'); renderGrid('c'); renderGrid('m');
  renderCounts();
}

function renderCounts(){
  const cnt = {};
  Object.keys(CLASSES).forEach(k => cnt[k] = 0);
  const scan = s => { if(s && s.c && cnt[s.c]!=null) cnt[s.c]++; };
  ['a','b','c'].forEach(g => state[g].forEach(row => row.forEach(scan)));
  state.m.forEach(scan);

  const container = document.getElementById('counts');
  let html = '';
  let grandCur = 0, grandTgt = 0;
  DEPTS.forEach(d => {
    let curSum = 0, tgtSum = 0;
    d.classes.forEach(c => { curSum += cnt[c]; tgtSum += CLASSES[c].target; });
    grandCur += curSum; grandTgt += tgtSum;
    html += `<div class="dept"><div class="dh"><span>${d.name}</span><span class="n">${curSum} / ${tgtSum}</span></div>`;
    d.classes.forEach(c => {
      const cur = cnt[c], tgt = CLASSES[c].target;
      const pct = Math.min(100, (cur/tgt)*100);
      const cls = cur > tgt ? 'over' : (cur === tgt ? 'done' : '');
      html += `<div class="row">
        <span class="sw" style="background:${CLASSES[c].color}"></span>
        <span class="k">${c}</span>
        <span class="b ${cls}"><span style="width:${pct}%"></span></span>
        <span class="v">${cur} / ${tgt}</span>
      </div>`;
    });
    html += `</div>`;
  });
  html += `<div class="totals">전체 ${grandCur} / ${grandTgt}명</div>`;
  container.innerHTML = html;
}

document.getElementById('clearAll').onclick = ()=>{
  if(confirm('모든 좌석 배정을 지웁니다. 계속할까요?')){
    state = makeEmptyState(); saveState(); renderAll();
  }
};
document.getElementById('exportJson').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = `chapel-seating-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importJson').onclick = ()=>{
  const input = document.createElement('input');
  input.type='file'; input.accept='application/json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ev=>{
      try{ state = JSON.parse(ev.target.result); saveState(); renderAll(); }
      catch(err){ alert('JSON 파일 형식 오류입니다.'); }
    };
    rd.readAsText(f);
  };
  input.click();
};
document.getElementById('print').onclick = ()=> window.print();

state = loadState();
renderClasses();
renderAll();
</script>
</body>
</html>
